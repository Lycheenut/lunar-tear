# Install this file inside nginx's http context (for example /etc/nginx/conf.d/).
# Replace example.com and the certificate paths before enabling it.

map "$request_method:$http_cf_connecting_ip" $auth_rate_key {
    default "";
    ~^POST:(.+)$ $1;
}

limit_req_zone $auth_rate_key zone=auth_login_per_ip:10m rate=5r/m;

map $http_cf_connecting_ip $admin_rate_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $admin_rate_key zone=admin_api_per_ip:10m rate=60r/m;

log_format lunar_safe '$http_cf_connecting_ip - $host "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    http2 on;
    server_name grpc.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/lunar-grpc.access.log lunar_safe;

    location / {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $http_cf_connecting_ip;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
        grpc_pass grpc://127.0.0.1:8003;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/lunar-auth.access.log lunar_safe;

    location / {
        limit_req zone=auth_login_per_ip burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name octo.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/lunar-octo.access.log lunar_safe;

    location / {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/lunar-admin.access.log lunar_safe;
    client_max_body_size 2m;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8082;
    }

    location ^~ /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8082;
    }

    location ^~ /api/admin/ {
        limit_req zone=admin_api_per_ip burst=30 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        return 404;
    }
}
