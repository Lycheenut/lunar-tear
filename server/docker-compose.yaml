name: lunar-tear

services:
  server:
    build: .
    image: kretts/lunar-tear:latest
    restart: unless-stopped
    environment:
      LUNAR_LISTEN: 0.0.0.0:8003
      LUNAR_PUBLIC_ADDR: ${LUNAR_PUBLIC_ADDR:-127.0.0.1:8003}
      LUNAR_OCTO_URL: ${LUNAR_OCTO_URL:-http://127.0.0.1:8080}
      LUNAR_AUTH_URL: http://auth:3000
      LUNAR_ADMIN_LISTEN: 0.0.0.0:8082
      LUNAR_ADMIN_TOKEN: ${LUNAR_ADMIN_TOKEN:-}
    volumes:
      - ./db:/opt/lunar-tear/db
      - ./assets:/opt/lunar-tear/assets
    ports:
      - 127.0.0.1:8003:8003
      - 127.0.0.1:8082:8082
    depends_on:
      - cdn
      - auth

  cdn:
    build:
      context: .
      dockerfile: Dockerfile.cdn
    image: kretts/octo-cdn:latest
    restart: unless-stopped
    command: ["--listen", "0.0.0.0:8080", "--public-addr", "${LUNAR_CDN_PUBLIC_ADDR:-127.0.0.1:8080}"]
    volumes:
      - ./assets:/opt/octo-cdn/assets
    ports:
      - 127.0.0.1:8080:8080

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    image: kretts/auth-server:latest
    restart: unless-stopped
    command: ["--listen", "0.0.0.0:3000", "--db", "db/auth.db", "--secret-file", "db/auth.secret", "--allowed-redirect-uris", "${LUNAR_AUTH_REDIRECT_URIS:-}"]
    volumes:
      - ./db:/opt/auth-server/db
    ports:
      - 127.0.0.1:3000:3000
